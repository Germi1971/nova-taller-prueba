# AUT-2 · PRUEBA DE PERMISOS del token con el que se publica lo que escribe Claude (sin IA, sin costo). La dispara SOLO la app de NOVA con un encargo
# etiquetado «prueba-permisos». NO TOCA main: los intentos de empujar, forzar, borrar y fusionar van contra `proteccion-prueba`, una rama descartable
# con la MISMA regla que main. Lo de administración se prueba solo LEYENDO (si pudiera leerlo, tendría un permiso de más). Sale 0 solo si todo da lo esperado.
name: Prueba de permisos
on:
  issues: { types: [opened] }
permissions: {}
jobs:
  permisos:
    if: github.actor == 'neolab-interlink[bot]' && contains(github.event.issue.labels.*.name, 'prueba-permisos')
    name: "permisos de Code @ ${{ github.event.issue.number }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: { contents: write, pull-requests: write, issues: write }   # los MISMOS que «publicar»
    steps:
      - uses: actions/checkout@v6
        with: { ref: proteccion-prueba, fetch-depth: 0 }
      - env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          set -u; mal=0; git config user.name prueba; git config user.email prueba@invalid
          P=proteccion-prueba; MAIN=$(git ls-remote origin refs/heads/main | cut -c1-40); P0=$(git rev-parse HEAD); RAMA="prueba-permisos-$GITHUB_RUN_ID"
          no() { if eval "$2" >/dev/null 2>&1; then echo "MAL PUDO $1"; mal=$((mal+1)); else echo "OK  no puede $1"; fi; }
          si() { if eval "$2" >/dev/null 2>&1; then echo "OK  puede $1"; else echo "MAL no pudo $1"; mal=$((mal+1)); fi; }
          echo x > prueba.txt; git add prueba.txt; git commit -qm prueba
          no "empujar a una rama protegida" "git push origin HEAD:$P"
          no "forzar una rama protegida" "git push --force origin HEAD:$P"
          no "borrar una rama protegida" "git push origin :$P"
          no "escribir en una rama protegida por la API" "gh api -X PUT repos/$R/contents/x.txt -f message=x -f content=eA== -f branch=$P"
          si "subir su propia rama" "git push origin HEAD:refs/heads/$RAMA"
          mkdir -p .github/workflows && echo 'on: push' > .github/workflows/malo.yml && git add .github && git commit -qm flujo
          no "subir un flujo de Actions (ni en su rama)" "git push origin HEAD:refs/heads/$RAMA"
          git reset -q --hard HEAD~1
          no "leer los webhooks (administración)" "gh api repos/$R/hooks"
          no "leer los secretos" "gh api repos/$R/actions/secrets"
          no "leer la configuración de Actions (administración)" "gh api repos/$R/actions/permissions"
          # Leer colaboradores es propio de Metadata: read (GitHub lo da siempre, no se puede sacar): se acepta como esperado (Germán, 26/11/2026).
          si "leer los colaboradores (propio de Metadata: read, solo lectura)" "gh api repos/$R/collaborators"
          si "abrir un PR hacia la rama protegida" "gh pr create --base $P --head $RAMA --title 'Prueba de permisos (no fusionar)' --body 'Se cierra sola.'"
          no "fusionar sin la aprobación de Germán" "gh pr merge $RAMA --merge"
          no "aprobar su propio PR" "gh pr review $RAMA --approve"
          gh pr close "$RAMA" >/dev/null 2>&1; git push -q origin ":refs/heads/$RAMA" 2>/dev/null
          [ "$(git ls-remote origin refs/heads/$P | cut -c1-40)" = "$P0" ] && echo "OK  la rama protegida quedó igual" || { echo "MAL la rama protegida cambió"; mal=$((mal+1)); }
          [ "$(git ls-remote origin refs/heads/main | cut -c1-40)" = "$MAIN" ] && echo "OK  main ni se tocó" || { echo "MAL main cambió"; mal=$((mal+1)); }
          echo; [ $mal = 0 ] && echo "Todo OK" || echo "$mal FALLAS"; exit $mal
